<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Router</title>
  
  <!-- HLS.js для онлайн-телевидения (.m3u8) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    iframe, video {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    const container = document.getElementById('app-container');
    const params = new URLSearchParams(window.location.search);
    
    let targetUrl = params.get('url');
    const legacyV = params.get('v');

    if (!targetUrl && legacyV) {
      targetUrl = 'https://www.youtube.com/watch?v=' + legacyV;
    }

    if (targetUrl) {
      routeMedia(decodeURIComponent(targetUrl));
    }

    function routeMedia(url) {
      const parentHost = window.location.hostname || 'localhost';

      // 1. YouTube (VOD, Shorts, Live, youtu.be)
      const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|shorts\/|live\/))([a-zA-Z0-9_-]{11})/i);
      if (ytMatch) {
        initYouTube(ytMatch[1]);
        return;
      }

      // 2. Twitch (Клипы)
      const twitchClipMatch = url.match(/(?:clips\.twitch\.tv\/|twitch\.tv\/[a-zA-Z0-9_]+\/clip\/)([a-zA-Z0-9_-]+)/i);
      if (twitchClipMatch) {
        initIframe(`https://clips.twitch.tv/embed?clip=${twitchClipMatch[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // 3. Twitch (Записи VOD)
      const twitchVideoMatch = url.match(/twitch\.tv\/videos\/([0-9]+)/i);
      if (twitchVideoMatch) {
        initIframe(`https://player.twitch.tv/?video=${twitchVideoMatch[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // 4. Twitch (Прямой эфир канала)
      const twitchChannelMatch = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)/i);
      if (twitchChannelMatch) {
        initIframe(`https://player.twitch.tv/?channel=${twitchChannelMatch[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // 5. Kick.com (Стримы)
      const kickMatch = url.match(/kick\.com\/([a-zA-Z0-9_-]+)/i);
      if (kickMatch) {
        initIframe(`https://player.kick.com/${kickMatch[1]}?autoplay=true`);
        return;
      }

      // 6. Телевидение IPTV / HLS (.m3u8)
      if (/\.m3u8(\?.*)?$/i.test(url)) {
        initHlsStream(url);
        return;
      }

      // 7. Прямые видеофайлы (.mp4, .webm, .mov, .m4v)
      if (/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url)) {
        initDirectVideo(url);
        return;
      }

      // 8. Vimeo (Live Event)
      const vimeoEventMatch = url.match(/vimeo\.com\/event\/([0-9]+)/i);
      if (vimeoEventMatch) {
        initIframe(`https://vimeo.com/event/${vimeoEventMatch[1]}/embed`);
        return;
      }

      // 9. Vimeo (Обычные видео)
      const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?([0-9]+)/i);
      if (vimeoMatch) {
        initIframe(`https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1&loop=1`);
        return;
      }

      // 10. Rutube (Видео и Shorts)
      const rutubeMatch = url.match(/rutube\.ru\/(?:video|shorts)\/([a-zA-Z0-9]+)/i);
      if (rutubeMatch) {
        initIframe(`https://rutube.ru/play/embed/${rutubeMatch[1]}/`);
        return;
      }

      // 11. VK Видео и Клипы
      const vkMatch = url.match(/(?:vk\.com\/(?:video|clip)|vkvideo\.ru\/video)(-?[0-9]+)_([0-9]+)/i);
      if (vkMatch) {
        initIframe(`https://vk.com/video_ext.php?oid=${vkMatch[1]}&id=${vkMatch[2]}&hd=2&autoplay=1`);
        return;
      }

      // 12. Dailymotion (длинные со слагом и короткие dai.ly)
      const dmShort = url.match(/dai\.ly\/([a-zA-Z0-9]+)/i);
      const dmLong = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/i);
      if (dmShort || dmLong) {
        const dmId = dmShort ? dmShort[1] : dmLong[1];
        initIframe(`https://geo.dailymotion.com/player.html?video=${dmId}`);
        return;
      }

      // 13. Rumble
      const rumbleMatch = url.match(/rumble\.com\/(?:embed\/|v)([a-zA-Z0-9_-]+)/i);
      if (rumbleMatch) {
        initIframe(`https://rumble.com/embed/${rumbleMatch[1]}/`);
        return;
      }

      // Резервный режим (Iframe)
      initIframe(url);
    }

    // Инициализация нативного YouTube плеера
    function initYouTube(videoId) {
      container.innerHTML = '<div id="yt-player"></div>';
      
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);

      window.onYouTubeIframeAPIReady = function() {
        let player = new YT.Player('yt-player', {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: {
            'autoplay': 1,
            'controls': 1,
            'fs': 0,
            'rel': 0,
            'iv_load_policy': 3,
            'modestbranding': 1,
            'playsinline': 1,
            'origin': window.location.origin
          },
          events: {
            'onReady': (event) => {
              event.target.playVideo();
              // Перемотка за 1.5с только для конечных роликов (отключена для прямых эфиров)
              setInterval(() => {
                if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
                  const dur = player.getDuration();
                  const cur = player.getCurrentTime();
                  if (dur > 3.0 && isFinite(dur) && cur >= (dur - 1.5)) {
                    player.seekTo(0, true);
                    player.playVideo();
                  }
                }
              }, 100);
            },
            'onStateChange': (event) => {
              if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0, true);
                player.playVideo();
              }
            }
          }
        });
      };
    }

    // Воспроизведение IPTV / HLS стримов
    function initHlsStream(url) {
      container.innerHTML = `<video id="video-stream" controls autoplay playsinline></video>`;
      const video = document.getElementById('video-stream');
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    // Воспроизведение прямых MP4 файлов
    function initDirectVideo(url) {
      container.innerHTML = `<video src="${url}" controls autoplay loop playsinline></video>`;
    }

    // Встраивание фрейма
    function initIframe(src) {
      container.innerHTML = `<iframe src="${src}" allow="autoplay; fullscreen; encrypted-media"></iframe>`;
    }
  </script>
</body>
</html>
