<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Router</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    iframe, video {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    const container = document.getElementById('app-container');
    const params = new URLSearchParams(window.location.search);
    
    // Поддержка как нового ?url=..., так и старого ?v=...
    let targetUrl = params.get('url');
    const legacyV = params.get('v');

    if (!targetUrl && legacyV) {
      targetUrl = 'https://www.youtube.com/watch?v=' + legacyV;
    }

    if (targetUrl) {
      routeMedia(decodeURIComponent(targetUrl));
    }

    function routeMedia(url) {
      // 1. YouTube (watch?v=, youtu.be/, /shorts/, /live/)
      const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        initYouTube(ytMatch[1]);
        return;
      }

      // 2. Прямые видеофайлы (.mp4, .webm, .mov, .m4v)
      if (/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url)) {
        initDirectVideo(url);
        return;
      }

      // 3. Vimeo
      const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?([0-9]+)/);
      if (vimeoMatch) {
        initIframe(`https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1&loop=1`);
        return;
      }

      // 4. Twitch (Стримы)
      const twitchMatch = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)/);
      if (twitchMatch) {
        const parentHost = window.location.hostname || 'localhost';
        initIframe(`https://player.twitch.tv/?channel=${twitchMatch[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // 5. Rutube
      const rutubeMatch = url.match(/rutube\.ru\/video\/([a-zA-Z0-9]+)/);
      if (rutubeMatch) {
        initIframe(`https://rutube.ru/play/embed/${rutubeMatch[1]}/`);
        return;
      }

      // 6. VK Видео
      const vkMatch = url.match(/vk\.com\/video(-?[0-9]+)_([0-9]+)/);
      if (vkMatch) {
        initIframe(`https://vk.com/video_ext.php?oid=${vkMatch[1]}&id=${vkMatch[2]}`);
        return;
      }

      // 7. Dailymotion
      const dmMatch = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
      if (dmMatch) {
        initIframe(`https://www.dailymotion.com/embed/video/${dmMatch[1]}?autoplay=1`);
        return;
      }

      // 8. Режим веб-браузера (любая другая ссылка)
      initIframe(url);
    }

    // Инициализация нативного YouTube плеера с таймером сброса
    function initYouTube(videoId) {
      container.innerHTML = '<div id="yt-player"></div>';
      
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);

      window.onYouTubeIframeAPIReady = function() {
        let player = new YT.Player('yt-player', {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: {
            'autoplay': 1,
            'controls': 1,
            'fs': 0,
            'rel': 0,
            'iv_load_policy': 3,
            'modestbranding': 1,
            'playsinline': 1,
            'origin': window.location.origin
          },
          events: {
            'onReady': (event) => {
              event.target.playVideo();
              // Перемотка на старт за 1.5с до конца (блокировка рекламы и рекомендаций)
              setInterval(() => {
                if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
                  const dur = player.getDuration();
                  const cur = player.getCurrentTime();
                  if (dur > 3.0 && cur >= (dur - 1.5)) {
                    player.seekTo(0, true);
                    player.playVideo();
                  }
                }
              }, 100);
            },
            'onStateChange': (event) => {
              if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0, true);
                player.playVideo();
              }
            }
          }
        });
      };
    }

    // Инициализация прямого MP4/WebM плеера
    function initDirectVideo(url) {
      container.innerHTML = `<video src="${url}" controls autoplay loop playsinline></video>`;
    }

    // Инициализация фрейма для остальных сервисов и веб-страниц
    function initIframe(src) {
      container.innerHTML = `<iframe src="${src}" allow="autoplay; fullscreen; encrypted-media"></iframe>`;
    }
  </script>
</body>
</html>
