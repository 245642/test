<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Clean Player</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.css" />

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .plyr, .plyr__video-wrapper {
      width: 100% !important;
      height: 100% !important;
    }

    /* Верхний блок с названием ролика и автором */
    #header-overlay {
      position: absolute;
      top: 18px;
      left: 24px;
      z-index: 10;
      color: #ffffff;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      transition: opacity 0.4s ease;
      max-width: 80%;
    }

    #video-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #video-author {
      font-size: 13px;
      color: #cccccc;
    }

    .plyr--hide-controls #header-overlay {
      opacity: 0;
    }

    /* Защитная маска против плашек YouTube на паузе */
    #pause-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      cursor: pointer;
    }

    #pause-shield.active {
      opacity: 1;
      pointer-events: auto;
    }

    .shield-play-btn {
      width: 68px;
      height: 68px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #pause-shield:hover .shield-play-btn {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.25);
    }

    .shield-play-btn svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div id="player-wrapper">
    <div id="header-overlay">
      <div id="video-title"></div>
      <div id="video-author"></div>
    </div>

    <!-- Защитная шторка паузы -->
    <div id="pause-shield">
      <div class="shield-play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <div id="player"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.min.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');

    if (videoId) {
      // 1. Метаданные через oEmbed
      fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + encodeURIComponent(videoId) + '&format=json')
        .then(response => {
          if (response.ok) return response.json();
          throw new Error('Network error');
        })
        .then(data => {
          document.getElementById('video-title').textContent = data.title || '';
          document.getElementById('video-author').textContent = data.author_name || '';
        })
        .catch(() => {
          document.getElementById('header-overlay').style.display = 'none';
        });

      // 2. Контейнер плеера
      const playerContainer = document.getElementById('player');
      playerContainer.setAttribute('data-plyr-provider', 'youtube');
      playerContainer.setAttribute('data-plyr-embed-id', videoId);

      // 3. Инициализация Plyr
      const player = new Plyr(playerContainer, {
        controls: [
          'play-large',
          'play',
          'progress',
          'current-time',
          'duration',
          'mute',
          'volume',
          'captions',
          'settings'
        ],
        settings: ['captions', 'quality', 'speed'],
        autoplay: true,
        muted: false,
        youtube: {
          noCookie: false,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          modestbranding: 1
        }
      });

      const pauseShield = document.getElementById('pause-shield');

      // Клик по защитной шторке снимает с паузы
      pauseShield.addEventListener('click', () => {
        player.play();
      });

      player.on('pause', () => {
        // Показываем маску, скрывая всплывающий мусор YouTube
        if (player.currentTime > 0.5) {
          pauseShield.classList.add('active');
        }
      });

      player.on('play', () => {
        pauseShield.classList.remove('active');
      });

      // 4. Высокоточный таймер упреждающего зацикливания (100 мс)
      setInterval(() => {
        if (player && player.playing && player.duration > 0) {
          // За 0.5 секунды до конца мгновенно перематываем на старт
          if (player.currentTime >= player.duration - 0.5) {
            player.currentTime = 0;
            player.play();
          }
        }
      }, 100);

      player.on('ready', () => {
        const plyrContainer = document.querySelector('.plyr');
        if (plyrContainer) {
          const header = document.getElementById('header-overlay');
          plyrContainer.appendChild(header);
          plyrContainer.appendChild(pauseShield);
        }
      });
    }
  </script>
</body>
</html>
