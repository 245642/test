<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal YouTube Player</title>
  
  <!-- Стили Plyr через Cloudflare CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .plyr, .plyr__video-wrapper {
      width: 100% !important;
      height: 100% !important;
    }

    /* Нижняя панель поверх всех масок */
    .plyr__controls {
      z-index: 10 !important;
    }

    /* Защитная шторка паузы (блокирует плашки YouTube) */
    #pause-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #pause-shield.active {
      display: flex;
    }

    .shield-play-btn {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #pause-shield:hover .shield-play-btn {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.25);
    }

    .shield-play-btn svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
      margin-left: 3px;
    }
  </style>
</head>
<body>

  <div id="player-wrapper">
    <!-- Защитная шторка на паузу -->
    <div id="pause-shield">
      <div class="shield-play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <!-- Контейнер плеера -->
    <div id="player"></div>
  </div>

  <!-- Движок Plyr -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.min.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');

    if (videoId) {
      const playerContainer = document.getElementById('player');
      playerContainer.setAttribute('data-plyr-provider', 'youtube');
      playerContainer.setAttribute('data-plyr-embed-id', videoId);

      // Инициализация плеера с жестко ограниченным набором контроллеров
      const player = new Plyr(playerContainer, {
        controls: [
          'play-large',    // Крупная кнопка старта по центру
          'play',          // Кнопка старт/пауза в панели
          'progress',      // Скраббер (полоса перемотки)
          'current-time',  // Текущее время
          'duration',      // Полная длительность
          'mute',          // Звук вкл/выкл
          'volume',        // Регулятор громкости
          'captions',      // Меню субтитров
          'settings'       // Шестеренка (качество, скорость, субтитры)
        ],
        settings: ['captions', 'quality', 'speed'],
        autoplay: true,
        muted: false,
        youtube: {
          noCookie: false,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          modestbranding: 1
        }
      });

      const pauseShield = document.getElementById('pause-shield');

      // Клик по экрану в режиме паузы возобновляет видео
      pauseShield.addEventListener('click', () => {
        player.play();
      });

      // Событие паузы: активируем глухую шторку поверх фрейма
      player.on('pause', () => {
        if (player.currentTime > 0.5) {
          pauseShield.classList.add('active');
        }
      });

      // Событие старта: скрываем шторку
      player.on('play', () => {
        pauseShield.classList.remove('active');
      });

      // Упреждающий сброс за 1.2 секунды до конца (исключает пост-ролл рекламу и рекомендации)
      setInterval(() => {
        if (player && player.playing && player.duration > 2.0) {
          if (player.currentTime >= player.duration - 1.2) {
            player.currentTime = 0;
            player.play();
          }
        }
      }, 100);

      // Монтирование защитной шторки внутрь контейнера плеера
      player.on('ready', () => {
        const plyrContainer = document.querySelector('.plyr');
        if (plyrContainer) {
          plyrContainer.appendChild(pauseShield);
        }
      });
    }
  </script>
</body>
</html>
