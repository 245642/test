<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    const container = document.getElementById('app-container');
    const params = new URLSearchParams(window.location.search);
    
    let targetUrl = params.get('url');
    const legacyV = params.get('v');

    if (!targetUrl && legacyV) {
      targetUrl = 'https://www.youtube.com/watch?v=' + legacyV;
    }

    if (targetUrl) {
      try {
        // Очистка от избыточного двойного экранирования
        if (targetUrl.includes('%3A') || targetUrl.includes('%2F')) {
          targetUrl = decodeURIComponent(targetUrl);
        }
      } catch (e) {}

      routeMedia(targetUrl.trim());
    }

    function routeMedia(url) {
      const parentHost = window.location.hostname || 'localhost';

      // 1. YouTube (VOD, Shorts, Live, youtu.be)
      const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|shorts\/|live\/))([a-zA-Z0-9_-]{11})/i);
      if (ytMatch) {
        initYouTube(ytMatch[1]);
        return;
      }

      // 2. Vimeo (ID, каналы, группы, закрытые с хэшем)
      const vimeoMatch = url.match(/vimeo\.com\/(?:.*\/)?([0-9]+)(?:\/([a-zA-Z0-9]+))?/i);
      if (vimeoMatch) {
        const vId = vimeoMatch[1];
        const vHash = vimeoMatch[2];
        const hashParam = vHash ? `?h=${vHash}&autoplay=1&loop=1` : `?autoplay=1&loop=1`;
        initIframe(`https://player.vimeo.com/video/${vId}${hashParam}`);
        return;
      }

      // 3. Twitch (Клипы)
      const twitchClip = url.match(/(?:clips\.twitch\.tv\/|twitch\.tv\/[a-zA-Z0-9_]+\/clip\/)([a-zA-Z0-9_-]+)/i);
      if (twitchClip) {
        initIframe(`https://clips.twitch.tv/embed?clip=${twitchClip[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // 4. Twitch (Записи VOD)
      const twitchVideo = url.match(/twitch\.tv\/videos\/([0-9]+)/i);
      if (twitchVideo) {
        initIframe(`https://player.twitch.tv/?video=${twitchVideo[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // 5. Twitch (Прямой эфир канала)
      const twitchChannel = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)/i);
      if (twitchChannel) {
        initIframe(`https://player.twitch.tv/?channel=${twitchChannel[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // 6. Kick.com (Стримы)
      const kickMatch = url.match(/kick\.com\/([a-zA-Z0-9_-]+)/i);
      if (kickMatch) {
        initIframe(`https://player.kick.com/${kickMatch[1]}?autoplay=true`);
        return;
      }

      // 7. SoundCloud (Исправленная передача адреса без двойного кодирования)
      if (/soundcloud\.com/i.test(url)) {
        initIframe(`https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=true`);
        return;
      }

      // 8. Mixcloud
      if (/mixcloud\.com/i.test(url)) {
        initIframe(`https://www.mixcloud.com/widget/iframe/?hide_cover=0&autoplay=1&feed=${encodeURIComponent(url)}`);
        return;
      }

      // 9. Coub
      const coubMatch = url.match(/coub\.com\/(?:view|embed)\/([a-zA-Z0-9]+)/i);
      if (coubMatch) {
        initIframe(`https://coub.com/embed/${coubMatch[1]}?autoplay=true&autoloop=true`);
        return;
      }

      // 10. Bilibili
      const biliMatch = url.match(/bilibili\.com\/video\/([a-zA-Z0-9]+)/i);
      if (biliMatch) {
        initIframe(`https://player.bilibili.com/player.html?bvid=${biliMatch[1]}&autoplay=1`);
        return;
      }

      // 11. Rumble
      const rumbleMatch = url.match(/rumble\.com\/(?:embed\/|v)([a-zA-Z0-9_-]+)/i);
      if (rumbleMatch) {
        initIframe(`https://rumble.com/embed/${rumbleMatch[1]}/`);
        return;
      }

      // 12. Rutube (Видео, Shorts, Прямые эфиры)
      const rutubeMatch = url.match(/rutube\.ru\/(?:video|shorts|play\/embed)\/([a-zA-Z0-9]+)/i);
      if (rutubeMatch) {
        initIframe(`https://rutube.ru/play/embed/${rutubeMatch[1]}/`);
        return;
      }

      // 13. VK Видео и Клипы
      const vkMatch = url.match(/(?:vk\.com|vkvideo\.ru)\/(?:video|clip)(-?[0-9]+)_([0-9]+)/i);
      if (vkMatch) {
        initIframe(`https://vk.com/video_ext.php?oid=${vkMatch[1]}&id=${vkMatch[2]}&hd=2&autoplay=1`);
        return;
      }

      // 14. Резервный режим
      initIframe(url);
    }

    // Инициализация нативного YouTube плеера
    function initYouTube(videoId) {
      container.innerHTML = '<div id="yt-player"></div>';
      
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);

      window.onYouTubeIframeAPIReady = function() {
        let player = new YT.Player('yt-player', {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: {
            'autoplay': 1,
            'controls': 1,
            'fs': 0,
            'rel': 0,
            'iv_load_policy': 3,
            'modestbranding': 1,
            'playsinline': 1,
            'cc_load_policy': 0, // Субтитры отключены по умолчанию
            'origin': window.location.origin
          },
          events: {
            'onReady': (event) => {
              event.target.playVideo();
              // Перемотка за 1.5с только для конечных видео (отключена для Live)
              setInterval(() => {
                if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
                  const dur = player.getDuration();
                  const cur = player.getCurrentTime();
                  if (dur > 3.0 && isFinite(dur) && cur >= (dur - 1.5)) {
                    player.seekTo(0, true);
                    player.playVideo();
                  }
                }
              }, 100);
            },
            'onStateChange': (event) => {
              if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0, true);
                player.playVideo();
              }
            }
          }
        });
      };
    }

    function initIframe(src) {
      container.innerHTML = `<iframe src="${src}" allow="autoplay; fullscreen; encrypted-media"></iframe>`;
    }
  </script>
</body>
</html>
