<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Player - Full MultiPack</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    const container = document.getElementById('app-container');
    const params = new URLSearchParams(window.location.search);
    
    let targetUrl = params.get('url');
    const legacyV = params.get('v');
    const startTimeParam = parseInt(params.get('start_time'), 10);
    let softSyncApplied = false;

    if (!targetUrl && legacyV) {
      targetUrl = 'https://www.youtube.com/watch?v=' + legacyV;
    }

    if (targetUrl) {
      try {
        if (targetUrl.includes('%3A') || targetUrl.includes('%2F')) {
          targetUrl = decodeURIComponent(targetUrl);
        }
      } catch (e) {}

      routeMedia(targetUrl.trim());
    }

    // Мягкая синхронизация времени старта (один раз при запуске)
    function applySoftSync(player, duration) {
      if (softSyncApplied || !startTimeParam || isNaN(startTimeParam) || startTimeParam <= 0) return;
      softSyncApplied = true;

      const now = Math.floor(Date.now() / 1000);
      const elapsed = now - startTimeParam;

      if (elapsed > 2) {
        let seekSec = elapsed;
        if (duration > 0 && isFinite(duration)) {
          seekSec = elapsed % duration;
        }
        if (typeof player.seekTo === 'function') {
          player.seekTo(seekSec, true);
        }
      }
    }

    function routeMedia(url) {
      const parentHost = window.location.hostname || 'localhost';
      const hostMatch = url.match(/https?:\/\/([^/]+)/i);
      const currentHost = hostMatch ? hostMatch[1] : '';

      // ==========================================
      //           1. ОСНОВНЫЕ МЕДИАСЕРВИСЫ
      // ==========================================

      // YouTube (VOD, Shorts, Live, youtu.be)
      const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|shorts\/|live\/))([a-zA-Z0-9_-]{11})/i);
      if (ytMatch) {
        initYouTube(ytMatch[1]);
        return;
      }

      // Twitch (Клипы)
      const twitchClip = url.match(/(?:clips\.twitch\.tv\/|twitch\.tv\/[a-zA-Z0-9_]+\/clip\/)([a-zA-Z0-9_-]+)/i);
      if (twitchClip) {
        initIframe(`https://clips.twitch.tv/embed?clip=${twitchClip[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // Twitch (VOD записи)
      const twitchVideo = url.match(/twitch\.tv\/videos\/([0-9]+)/i);
      if (twitchVideo) {
        initIframe(`https://player.twitch.tv/?video=${twitchVideo[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // Twitch (Каналы Live)
      const twitchChannel = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)/i);
      if (twitchChannel) {
        initIframe(`https://player.twitch.tv/?channel=${twitchChannel[1]}&parent=${parentHost}&autoplay=true`);
        return;
      }

      // Kick.com (Стримы)
      const kickMatch = url.match(/kick\.com\/([a-zA-Z0-9_-]+)/i);
      if (kickMatch) {
        initIframe(`https://player.kick.com/${kickMatch[1]}?autoplay=true`);
        return;
      }

      // Vimeo (все структуры ссылок + loop)
      const vimeoMatch = url.match(/vimeo\.com\/(?:.*\/)?([0-9]+)(?:\/([a-zA-Z0-9]+))?/i);
      if (vimeoMatch) {
        const vId = vimeoMatch[1];
        const vHash = vimeoMatch[2];
        const hashParam = vHash ? `?h=${vHash}&autoplay=1&loop=1` : `?autoplay=1&loop=1`;
        initIframe(`https://player.vimeo.com/video/${vId}${hashParam}`);
        return;
      }

      // Coub (Зацикленные видео со звуком)
      const coubMatch = url.match(/coub\.com\/(?:view|embed)\/([a-zA-Z0-9]+)/i);
      if (coubMatch) {
        initIframe(`https://coub.com/embed/${coubMatch[1]}?autoplay=true&autoloop=true`);
        return;
      }

      // Rutube (Видео, Shorts, Эфиры)
      const rutubeMatch = url.match(/rutube\.ru\/(?:video|shorts|play\/embed)\/([a-zA-Z0-9]+)/i);
      if (rutubeMatch) {
        initIframe(`https://rutube.ru/play/embed/${rutubeMatch[1]}/`);
        return;
      }

      // VK Видео и Клипы (с параметром loop=1)
      const vkMatch = url.match(/(?:vk\.com|vkvideo\.ru)\/(?:video|clip)(-?[0-9]+)_([0-9]+)/i);
      if (vkMatch) {
        initIframe(`https://vk.com/video_ext.php?oid=${vkMatch[1]}&id=${vkMatch[2]}&hd=2&autoplay=1&loop=1`);
        return;
      }

      // Дзен Видео (dzen.ru)
      const dzenMatch = url.match(/dzen\.ru\/(?:video\/watch|embed)\/([a-zA-Z0-9_-]+)/i);
      if (dzenMatch) {
        initIframe(`https://dzen.ru/embed/${dzenMatch[1]}?from_block=partner&from=you&mute=0&autoplay=1`);
        return;
      }

      // Одноклассники Видео (ok.ru)
      const okMatch = url.match(/(?:ok\.ru|m\.ok\.ru)\/(?:video|videoembed)\/([0-9]+)/i);
      if (okMatch) {
        initIframe(`https://ok.ru/videoembed/${okMatch[1]}?autoplay=1`);
        return;
      }

      // Mail.ru Видео (my.mail.ru)
      if (/my\.mail\.ru\//i.test(url)) {
        const mailMatch = url.match(/my\.mail\.ru\/(?:video\/embed\/)?(.+?)(?:\.html)?$/i);
        if (mailMatch) {
          initIframe(`https://my.mail.ru/video/embed/${mailMatch[1]}`);
          return;
        }
      }

      // ==========================================
      //           2. ADULT-ВИДЕОХОСТИНГИ
      // ==========================================

      // PornHub (Все зеркала: rt, de, org и др. + Shorties)
      if (/pornhub\./i.test(currentHost)) {
        const phKey = url.match(/[?&]viewkey=([a-zA-Z0-9_-]+)/i) || 
                      url.match(/(?:shorties|shorts|embed)\/([a-zA-Z0-9_-]+)/i);
        if (phKey) {
          initIframe(`https://${currentHost}/embed/${phKey[1]}`);
          return;
        }
      }

      // XVideos (Все зеркала)
      if (/xvideos\./i.test(currentHost)) {
        const xvMatch = url.match(/video([0-9]+)/i) || url.match(/[?&]id=([0-9]+)/i);
        if (xvMatch) {
          initIframe(`https://${currentHost}/embedframe/${xvMatch[1]}`);
          return;
        }
      }

      // XNXX (Все зеркала)
      if (/xnxx\./i.test(currentHost)) {
        const xnMatch = url.match(/(?:video-([a-zA-Z0-9_-]+)|video([0-9]+))/i);
        if (xnMatch) {
          const xnId = xnMatch[1] || xnMatch[2];
          initIframe(`https://${currentHost}/embedframe/${xnId}`);
          return;
        }
      }

      // SpankBang
      const sbMatch = url.match(/spankbang\.com\/([a-zA-Z0-9]+)\/(?:video|embed)/i);
      if (sbMatch) {
        initIframe(`https://spankbang.com/${sbMatch[1]}/embed/`);
        return;
      }

      // RedTube
      const rtMatch = url.match(/redtube\.com\/([0-9]+)/i);
      if (rtMatch) {
        initIframe(`https://embed.redtube.com/?id=${rtMatch[1]}`);
        return;
      }

      // Eporner
      const epMatch = url.match(/eporner\.com\/(?:video-|embed\/)([a-zA-Z0-9]+)/i);
      if (epMatch) {
        initIframe(`https://www.eporner.com/embed/${epMatch[1]}/`);
        return;
      }

      // ==========================================
      //           3. ADULT-ТРАНСЛЯЦИИ (LIVE)
      // ==========================================

      // Chaturbate (Все зеркала)
      if (/chaturbate\.com/i.test(currentHost)) {
        const cbMatch = url.match(/chaturbate\.com\/([a-zA-Z0-9_-]+)\/?/i);
        const reserved = ['tags', 'female-cams', 'male-cams', 'couple-cams', 'trans-cams', 'auth', 'terms'];
        if (cbMatch && !reserved.includes(cbMatch[1].toLowerCase())) {
          initIframe(`https://${currentHost}/embed/${cbMatch[1]}/?bgcolor=black`);
          return;
        }
      }

      // Stripchat (Все зеркала)
      if (/stripchat\./i.test(currentHost)) {
        const scMatch = url.match(/stripchat\.[a-z.]+\/([a-zA-Z0-9_-]+)\/?/i);
        const scReserved = ['tags', 'categories', 'login', 'terms', 'privacy'];
        if (scMatch && !scReserved.includes(scMatch[1].toLowerCase())) {
          initIframe(`https://${currentHost}/embed/${scMatch[1]}`);
          return;
        }
      }

      // BongaCams (Все зеркала)
      if (/bongacams\./i.test(currentHost)) {
        const bcMatch = url.match(/bongacams\.[a-z.]+\/([a-zA-Z0-9_-]+)\/?/i);
        if (bcMatch) {
          initIframe(`https://${currentHost}/embed/${bcMatch[1]}`);
          return;
        }
      }

      // Резервный режим (Iframe)
      initIframe(url);
    }

    // Инициализация нативного YouTube плеера
    function initYouTube(videoId) {
      container.innerHTML = '<div id="yt-player"></div>';
      
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);

      window.onYouTubeIframeAPIReady = function() {
        let player = new YT.Player('yt-player', {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: {
            'autoplay': 1,
            'controls': 1,
            'fs': 0,
            'rel': 0,
            'iv_load_policy': 3,
            'modestbranding': 1,
            'playsinline': 1,
            'cc_load_policy': 0,
            'origin': window.location.origin
          },
          events: {
            'onReady': (event) => {
              event.target.playVideo();

              setTimeout(() => {
                applySoftSync(player, player.getDuration());
              }, 600);

              // Перемотка за 1.5с только для конечных видео
              setInterval(() => {
                if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
                  const dur = player.getDuration();
                  const cur = player.getCurrentTime();
                  if (dur > 3.0 && isFinite(dur) && cur >= (dur - 1.5)) {
                    player.seekTo(0, true);
                    player.playVideo();
                  }
                }
              }, 100);
            },
            'onStateChange': (event) => {
              if (event.data === YT.PlayerState.PLAYING) {
                applySoftSync(player, player.getDuration());
              }
              if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0, true);
                player.playVideo();
              }
            }
          }
        });
      };
    }

    function initIframe(src) {
      container.innerHTML = `<iframe src="${src}" allow="autoplay; fullscreen; encrypted-media"></iframe>`;
    }
  </script>
</body>
</html>
