<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background-color:#000; }
    iframe { border:0; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="player" style="width:100%;height:100%;"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    if (videoId) {
      document.getElementById('player').innerHTML = 
        '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&controls=1&loop=1&playlist=' + encodeURIComponent(videoId) + '" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    }
  </script>
</body>
</html>
