<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native YouTube Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }

    #player {
      width: 100vw;
      height: 100vh;
      border: 0;
    }

    iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <!-- Официальный скрипт YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let loopCheckInterval;

    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');

    function onYouTubeIframeAPIReady() {
      if (!videoId) return;

      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: videoId,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'fs': 0,               // Отключение кнопки полного экрана
          'rel': 0,              // Отключение сторонних рекомендаций
          'iv_load_policy': 3,   // Отключение аннотаций авторов
          'modestbranding': 1,   // Минимизация логотипов
          'playsinline': 1,
          'enablejsapi': 1,
          'origin': window.location.origin
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();

      // Упреждающий сброс за 1.5 секунды до конца (блокирует экран окончания и рекламу)
      clearInterval(loopCheckInterval);
      loopCheckInterval = setInterval(() => {
        if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
          const duration = player.getDuration();
          const currentTime = player.getCurrentTime();

          if (duration > 3.0 && currentTime >= (duration - 1.5)) {
            player.seekTo(0, true);
            player.playVideo();
          }
        }
      }, 100);
    }

    function onPlayerStateChange(event) {
      // Резервный перезапуск, если плеер все же перешел в статус завершения (код 0)
      if (event.data === YT.PlayerState.ENDED) {
        player.seekTo(0, true);
        player.playVideo();
      }
    }
  </script>
</body>
</html>
