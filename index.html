<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Minimal Native Player</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    }

    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: default;
    }

    #player-container.hide-ui {
      cursor: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Верхний блок с названием */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 24px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      z-index: 10;
      color: #fff;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #video-title {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    #video-author {
      font-size: 13px;
      color: #aaa;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* Нижняя панель управления */
    #controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0 16px 10px 16px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      z-index: 10;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease;
    }

    .hide-ui #controls-bar,
    .hide-ui #top-bar {
      opacity: 0;
    }

    /* Скраббер (полоса перемотки) */
    #progress-container {
      position: relative;
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
      margin-bottom: 4px;
    }

    #progress-bg {
      position: absolute;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      transition: height 0.1s ease;
    }

    #progress-container:hover #progress-bg {
      height: 5px;
    }

    #progress-buffer {
      position: absolute;
      width: 0%;
      height: 100%;
      background: rgba(255, 255, 255, 0.4);
    }

    #progress-played {
      position: absolute;
      width: 0%;
      height: 100%;
      background: #ff0000;
    }

    #progress-thumb {
      position: absolute;
      left: 0%;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ff0000;
      transform: translate(-50%, 0);
      opacity: 0;
      transition: opacity 0.1s ease, transform 0.1s ease;
    }

    #progress-container:hover #progress-thumb {
      opacity: 1;
    }

    /* Нижние кнопки */
    #buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      fill: #fff;
      transition: opacity 0.15s ease;
    }

    .btn:hover {
      opacity: 0.8;
    }

    .btn svg {
      width: 24px;
      height: 24px;
    }

    /* Блок громкости */
    .volume-group {
      display: flex;
      align-items: center;
    }

    #volume-slider-container {
      width: 0;
      overflow: hidden;
      transition: width 0.2s ease;
      display: flex;
      align-items: center;
    }

    .volume-group:hover #volume-slider-container {
      width: 64px;
      margin-left: 6px;
    }

    #volume-slider {
      -webkit-appearance: none;
      width: 60px;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
      outline: none;
      cursor: pointer;
    }

    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
    }

    /* Время */
    #time-display {
      color: #ddd;
      font-size: 12px;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    /* Фирменный крутящийся спиннер YouTube */
    #spinner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      z-index: 20;
      transition: opacity 0.2s ease;
    }

    #spinner-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .yt-spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: yt-spin 0.8s linear infinite;
    }

    @keyframes yt-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Сообщение об ошибке */
    #error-msg {
      position: absolute;
      color: #ff4d4d;
      font-size: 14px;
      text-align: center;
      z-index: 30;
      display: none;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <div id="spinner-overlay">
      <div class="yt-spinner"></div>
    </div>

    <div id="error-msg">Не удалось загрузить видео. Повторите попытку.</div>

    <div id="top-bar">
      <div id="video-title">Загрузка видео...</div>
      <div id="video-author"></div>
    </div>

    <video id="video-el" playsinline loop autoplay></video>

    <div id="controls-bar">
      <!-- Скраббер -->
      <div id="progress-container">
        <div id="progress-bg">
          <div id="progress-buffer"></div>
          <div id="progress-played"></div>
        </div>
        <div id="progress-thumb"></div>
      </div>

      <!-- Кнопки управления -->
      <div id="buttons-row">
        <div class="left-controls">
          <!-- Play / Pause -->
          <button class="btn" id="play-btn">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <!-- Громкость -->
          <div class="volume-group">
            <button class="btn" id="mute-btn">
              <svg id="vol-high-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="vol-mute-icon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <div id="volume-slider-container">
              <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>
          </div>

          <!-- Таймкоды -->
          <div id="time-display">0:00 / 0:00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video-el');
    const container = document.getElementById('player-container');
    const spinner = document.getElementById('spinner-overlay');
    const errorMsg = document.getElementById('error-msg');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const muteBtn = document.getElementById('mute-btn');
    const volHighIcon = document.getElementById('vol-high-icon');
    const volMuteIcon = document.getElementById('vol-mute-icon');
    const volumeSlider = document.getElementById('volume-slider');
    const timeDisplay = document.getElementById('time-display');
    const progressContainer = document.getElementById('progress-container');
    const progressPlayed = document.getElementById('progress-played');
    const progressBuffer = document.getElementById('progress-buffer');
    const progressThumb = document.getElementById('progress-thumb');
    const titleEl = document.getElementById('video-title');
    const authorEl = document.getElementById('video-author');

    // Пул публичных API Invidious для каскадного опроса
    const API_INSTANCES = [
      'https://yewtu.be',
      'https://invidious.nerdvpn.de',
      'https://inv.nadeko.net',
      'https://invidious.tiekoetter.com',
      'https://inv.thepixora.com'
    ];

    // Форматирование времени в 0:00
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Автоматическое скрытие UI при отсутствии активности
    let hideTimeout;
    function resetHideTimeout() {
      container.classList.remove('hide-ui');
      clearTimeout(hideTimeout);
      if (!video.paused) {
        hideTimeout = setTimeout(() => {
          container.classList.add('hide-ui');
        }, 2500);
      }
    }
    container.addEventListener('mousemove', resetHideTimeout);
    container.addEventListener('click', resetHideTimeout);

    // Play / Pause логика
    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }
    playBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    video.addEventListener('play', () => {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      resetHideTimeout();
    });

    video.addEventListener('pause', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      container.classList.remove('hide-ui');
      clearTimeout(hideTimeout);
    });

    // Управление звуком
    volumeSlider.addEventListener('input', (e) => {
      video.volume = parseFloat(e.target.value);
      video.muted = (video.volume === 0);
      updateVolumeUI();
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      updateVolumeUI();
    });

    function updateVolumeUI() {
      if (video.muted || video.volume === 0) {
        volHighIcon.style.display = 'none';
        volMuteIcon.style.display = 'block';
      } else {
        volHighIcon.style.display = 'block';
        volMuteIcon.style.display = 'none';
        volumeSlider.value = video.volume;
      }
    }

    // Обновление скраббера и времени
    video.addEventListener('timeupdate', () => {
      if (!isDraggingProgress && video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressPlayed.style.width = pct + '%';
        progressThumb.style.left = pct + '%';
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }

      // Обновление полосы буфера
      if (video.buffered.length > 0 && video.duration) {
        const bufferedEnd = video.buffered.end(video.buffered.length - 1);
        progressBuffer.style.width = (bufferedEnd / video.duration) * 100 + '%';
      }
    });

    // Перемотка кликом и перетаскиванием
    let isDraggingProgress = false;
    function seek(e) {
      const rect = progressContainer.getBoundingClientRect();
      let pos = (e.clientX - rect.left) / rect.width;
      pos = Math.max(0, Math.min(1, pos));
      progressPlayed.style.width = (pos * 100) + '%';
      progressThumb.style.left = (pos * 100) + '%';
      if (video.duration) {
        video.currentTime = pos * video.duration;
      }
    }

    progressContainer.addEventListener('mousedown', (e) => {
      isDraggingProgress = true;
      seek(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (isDraggingProgress) seek(e);
    });
    window.addEventListener('mouseup', () => {
      isDraggingProgress = false;
    });

    // Индикация спиннера загрузки
    video.addEventListener('waiting', () => spinner.classList.remove('hidden'));
    video.addEventListener('playing', () => spinner.classList.add('hidden'));
    video.addEventListener('canplay', () => spinner.classList.add('hidden'));

    // Получение потока через пул серверов
    async function fetchStreamWithFailover(id) {
      for (let i = 0; i < API_INSTANCES.length; i++) {
        const host = API_INSTANCES[i];
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2500);

          const res = await fetch(`${host}/api/v1/videos/${id}`, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (!res.ok) continue;
          const data = await res.json();

          if (data && data.formatStreams && data.formatStreams.length > 0) {
            // Ищем наилучшее качество MP4 (720p или ниже)
            let chosen = data.formatStreams.find(s => s.resolution === '720p' && s.container === 'mp4') ||
                         data.formatStreams.find(s => s.container === 'mp4') ||
                         data.formatStreams[0];

            if (chosen && chosen.url) {
              titleEl.textContent = data.title || '';
              authorEl.textContent = data.author || '';
              return chosen.url;
            }
          }
        } catch (err) {
          // Сервер не ответил за 2.5 сек, переходим к следующему
        }
      }
      return null;
    }

    // Инициализация при запуске
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get('v');
      const directUrl = params.get('url') || params.get('src');

      // 1. Если передана прямая ссылка на MP4 файл
      if (directUrl) {
        titleEl.textContent = "Прямой медиапоток";
        authorEl.textContent = "";
        video.src = decodeURIComponent(directUrl);
        video.play().catch(() => {});
        return;
      }

      // 2. Если передан YouTube ID
      if (videoId) {
        spinner.classList.remove('hidden');
        const streamUrl = await fetchStreamWithFailover(videoId);

        if (streamUrl) {
          video.src = streamUrl;
          video.play().catch(() => {});
        } else {
          spinner.classList.add('hidden');
          errorMsg.style.display = 'block';
        }
      }
    }

    init();
  </script>
</body>
</html>
